# 開発ツールのバージョンをチーム全員でそろえる設定（mise）
# 初回：mise trust → mise install
# 版を上げるときは PR で変更し、docs/tech-stack.md も更新する
[tools]
# CMake 4 は古い cmake_minimum_required を書いたライブラリ（cJSON など）を受け付けないため、3.31 系に固定する
cmake = "3.31.12"
ninja = "1.13.2"
lefthook = "2.2.2"
# clang-format と clang-tidy は PyPI 配布版を使う。uv はそのインストールに使われる
uv = "0.13.6"
"pipx:clang-format" = "23.1.3"
"pipx:clang-tidy" = "23.1.4"
