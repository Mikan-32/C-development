# CI：PR ごとと main への統合時に実行する
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux（整形チェック・ビルド・テスト・サニタイザー）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          lfs: true
      - name: ツールを入れる（mise.toml の版）
        uses: jdx/mise-action@v5
      - name: clang とサニタイザーのランタイムを入れる
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev libssl-dev tcl make
      - name: 整形チェック（clang-format）
        run: git ls-files '*.c' '*.h' ':!:third_party/**' | xargs -r clang-format --dry-run --Werror
      - name: SQLCipher の固定ソースから amalgamation を生成
        run: bash scripts/generate-sqlcipher.sh
      - name: 構成
        run: cmake --preset linux-sanitize
      - name: ビルド
        run: cmake --build --preset linux-sanitize
      - name: テスト（ASan＋UBSan）
        run: ctest --preset linux-sanitize

  windows:
    name: Windows（clang-cl でビルド・テスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Visual Studio の開発者環境を読み込む
        uses: ilammy/msvc-dev-cmd@v1
      - name: OpenSSL のビルド済みライブラリをキャッシュ
        id: openssl-cache
        uses: actions/cache@v5
        with:
          path: third_party/prebuilt/openssl
          key: windows-x64-debug-openssl-${{ hashFiles('cmake/dependencies.json', 'scripts/build-openssl-windows.ps1') }}
      - name: Windows 用 OpenSSL を作る
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $perl = (Get-Command perl.exe -CommandType Application -ErrorAction Stop).Source
          ./scripts/build-openssl-windows.ps1 -PerlPath $perl -Configuration Debug
      - name: SQLCipher の固定ソースから amalgamation を生成
        shell: cmd
        run: scripts\generate-sqlcipher.cmd
      - name: 構成
        run: cmake --preset windows-clang -DNK_WARNINGS_AS_ERRORS=ON
      - name: ビルド
        run: cmake --build --preset windows-clang
      - name: テスト
        run: ctest --preset windows-clang

  android-native:
    name: Android（C 部分のビルド確認・NDK r28 以降）
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: ツールを入れる（mise.toml の版）
        uses: jdx/mise-action@v5
      - name: NDK の場所と版を確認する
        run: |
          ndk="$ANDROID_NDK_LATEST_HOME"
          rev=$(grep 'Pkg.Revision' "$ndk/source.properties" | sed 's/.*= *//')
          echo "NDK: $ndk ($rev)"
          if [ "${rev%%.*}" -lt 28 ]; then
            echo "NDK r28 以降が必要です（16KB ページサイズ対応のため）"
            exit 1
          fi
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"
          echo "NK_NDK_VERSION=$rev" >> "$GITHUB_ENV"
      - name: ソース生成用のツールを入れる
        run: sudo apt-get update && sudo apt-get install -y tcl make perl
      - name: Android 用 OpenSSL をキャッシュ
        id: android-openssl-cache
        uses: actions/cache@v5
        with:
          path: third_party/prebuilt/openssl
          key: android-arm64-api26-ndk${{ env.NK_NDK_VERSION }}-openssl-${{ hashFiles('cmake/dependencies.json', 'scripts/build-openssl-android.sh') }}
      - name: Android 用 OpenSSL を作る
        if: steps.android-openssl-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl-android.sh "$ANDROID_NDK" arm64-v8a
      - name: SQLCipher の固定ソースから amalgamation を生成
        run: bash scripts/generate-sqlcipher.sh
      - name: 構成
        run: cmake --preset android-arm64
      - name: ビルド
        run: cmake --build --preset android-arm64
